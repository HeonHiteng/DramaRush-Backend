# Supabase CLI project config. If your installed CLI version complains about
# missing/renamed fields, run `supabase init` in this folder and let it merge
# — the important parts of this repo are supabase/migrations/ and
# supabase/functions/.
#
# Live project: keybox (ref ogqagauogrzezfmveewk, ap-southeast-1).

project_id = "keybox"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
# "dramarush://" stays until the app's brand.scheme is switched to "keybox".
additional_redirect_urls = ["keybox://", "dramarush://", "http://localhost:8081"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = ""
secret = ""

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

# Edge Functions. playback-token / delete-account / admin-video-* require a signed-in caller.
# stream-webhook is authenticated by Cloudflare's HMAC signature and
# stream-usage-sync by the Vault cron secret, so they skip JWT verification.
[functions.playback-token]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.admin-video-upload]
verify_jwt = true

[functions.admin-video-delete]
verify_jwt = true

[functions.stream-webhook]
verify_jwt = false

[functions.stream-usage-sync]
verify_jwt = false

# guest-session signs a device in as its guest account. There is no caller JWT
# yet at that point: it is authenticated by the device key (HMAC with the
# GUEST_DEVICE_SECRET function secret) and capped per IP per day
# (guest_new_per_ip_per_day); Turnstile to follow.
[functions.guest-session]
verify_jwt = false
